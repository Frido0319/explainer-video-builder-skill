<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="200" fill="#ffffff"/>
  <rect x="0" y="0" width="860" height="8" fill="#2563eb"/>

  <!-- 左侧标题区 -->
  <text x="48" y="72" font-size="34" font-weight="bold" fill="#111827">Explainer Video Builder</text>
  <rect x="52" y="90" width="96" height="5" rx="2.5" fill="#2563eb"/>
  <text x="50" y="128" font-size="18" fill="#6b7280">技术讲解视频 · 白底学术风画面</text>
  <text x="50" y="156" font-size="18" fill="#6b7280">规范 SVG 架构图 · 中文配音 · 一键合成</text>

  <!-- 右侧流程五步 -->
  <g transform="translate(470, 56)">
    <!-- 卡片 -->
    <rect x="0"  y="0" width="64" height="64" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="14" y="16" width="36" height="26" rx="4" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="14" y1="52" x2="50" y2="52" stroke="#2563eb" stroke-width="2.5"/>
    <text x="32" y="84" text-anchor="middle" font-size="13" fill="#111827">画面卡</text>

    <!-- 架构图 -->
    <rect x="88" y="0" width="64" height="64" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <rect x="98" y="16" width="16" height="16" rx="3" fill="none" stroke="#dc2626" stroke-width="2"/>
    <rect x="120" y="16" width="16" height="16" rx="3" fill="#dc2626"/>
    <path d="M 106,32 L 106,42 L 128,42 L 128,32" fill="none" stroke="#dc2626" stroke-width="2"/>
    <rect x="98" y="42" width="16" height="16" rx="3" fill="#dc2626"/>
    <text x="120" y="84" text-anchor="middle" font-size="13" fill="#111827">技术图</text>

    <!-- 配音 -->
    <rect x="176" y="0" width="64" height="64" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <path d="M 196,24 q8,-14 16,0 q8,14 16,0" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 204,34 q4,-7 8,0" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="214" cy="42" r="3" fill="#16a34a"/>
    <text x="208" y="84" text-anchor="middle" font-size="13" fill="#111827">配音</text>

    <!-- 合成 -->
    <rect x="264" y="0" width="64" height="64" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <circle cx="296" cy="34" r="16" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <path d="M 296,34 L 304,24" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <rect x="283" y="52" width="9" height="5" rx="1" fill="#f59e0b"/>
    <text x="296" y="84" text-anchor="middle" font-size="13" fill="#111827">合成</text>

    <!-- 验证 -->
    <rect x="352" y="0" width="64" height="64" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
    <circle cx="384" cy="32" r="15" fill="none" stroke="#7c3aed" stroke-width="3"/>
    <path d="M 376,32 l6,6 l10,-12" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="384" y="84" text-anchor="middle" font-size="13" fill="#111827">验证</text>
  </g>

  <text x="486" y="168" font-size="13" fill="#9ca3af">卡片 → 图 → 配音 → 合成 → 自检</text>
</svg>
